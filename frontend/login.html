<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Login | PG Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Ambient Glow Background -->
    <div class="ambient-bg">
        <div class="ambient-glow-1"></div>
        <div class="ambient-glow-2"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand-logo">🏠</div>
                <h1 class="auth-title">PG Portal Login</h1>
                <p class="auth-subtitle">Sign in to manage rooms, students & billing</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="e.g. admin or john_worker" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 10px;">
                    Sign In to Dashboard →
                </button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
                Protected by JWT Bearer Authentication & Supabase
            </div>
        </div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

services:
  - type: web
    name: pg-management-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip -&& pip install -r requirements.txt 
    buildCommand: pip install --upgrade pip +&& pip install --no-cache-dir -r requirement +s.txt && python -c "import email_validator; +print('email_validator OK', email_validator. +__version__)""
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENV
        value: production
